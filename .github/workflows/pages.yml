name: Test And Deploy Sunny Life

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser Tests
        run: npx playwright test tests/browser/coastal-release.spec.js tests/browser/resident-proportions.spec.js tests/browser/daily-life.spec.js tests/browser/apartment.spec.js tests/browser/resident-delivery.spec.js tests/browser/computer-daylight.spec.js tests/browser/supplied-models.spec.js tests/browser/career-needs.spec.js tests/browser/life-mechanics.spec.js tests/browser/workplace-story.spec.js tests/browser/calendar-social.spec.js --fully-parallel --workers=1 --reporter=line --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: test-results
          retention-days: 3
  build:
    needs: browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
